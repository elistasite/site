<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ВайбМаркет — купи и продай сайт, приложение или бота</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=Unbounded:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef0f7;--card:#fff;--ink:#161a2b;--mute:#6b7190;--line:#dfe3f0;--acc:#5b4dff;--acc2:#e8e5ff;--heart:#ff4d6d;--ok:#12a36b;--r:16px;--shadow:0 1px 2px rgba(22,26,43,.06),0 8px 24px -12px rgba(22,26,43,.18)}
:root[data-theme=dark]{--bg:#0f1220;--card:#181c30;--ink:#eef0ff;--mute:#9aa0c4;--line:#2a2f4d;--acc:#8b80ff;--acc2:#25264a;--shadow:0 8px 24px -12px rgba(0,0,0,.6)}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font-family:Manrope,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45;padding-bottom:84px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:12px;padding:12px 0}
.logo{font-family:Unbounded,Manrope,sans-serif;font-weight:800;font-size:20px;white-space:nowrap}
.logo b{color:var(--acc)}
.search{flex:1;position:relative;min-width:0}
.search input{width:100%;padding:12px 14px 12px 42px;border-radius:12px;border:2px solid var(--line);background:var(--bg)}
.search input:focus{border-color:var(--acc);outline:0}
.search span{position:absolute;left:14px;top:50%;transform:translateY(-50%)}
.btn{background:var(--acc);color:#fff;padding:12px 18px;border-radius:12px;font-weight:800;white-space:nowrap}
.btn:hover{filter:brightness(1.1)}
.ghost{background:var(--acc2);color:var(--acc)}
.icon{width:44px;height:44px;border-radius:12px;background:var(--bg);font-size:18px;flex:none}
.cats{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.chip{flex:none;padding:9px 14px;border-radius:99px;background:var(--bg);font-weight:600;border:2px solid transparent}
.chip[aria-pressed=true]{background:var(--acc);color:#fff}
.hero{padding:28px 0 8px}
.hero h1{font-family:Unbounded,Manrope,sans-serif;font-size:clamp(24px,4.6vw,40px);line-height:1.15;max-width:760px}
.hero p{color:var(--mute);margin-top:10px;max-width:560px}
.stats{display:flex;gap:20px;margin-top:14px;flex-wrap:wrap;font-weight:600;color:var(--mute)}
.stats b{color:var(--ink)}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:20px 0 14px}
.bar select,.bar label{padding:10px 12px;border-radius:12px;background:var(--card);border:2px solid var(--line);font-weight:600}
.bar label{display:flex;gap:8px;align-items:center;cursor:pointer}
.bar .count{margin-left:auto;color:var(--mute);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;cursor:pointer;display:flex;flex-direction:column;transition:transform .15s}
.card:hover{transform:translateY(-3px)}
.thumb{height:128px;display:grid;place-items:center;font-size:56px;position:relative}
.fav{position:absolute;top:10px;right:10px;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.92);font-size:18px;color:#999}
.fav[aria-pressed=true]{color:var(--heart)}
.tag{position:absolute;left:10px;top:10px;background:rgba(22,26,43,.85);color:#fff;font-size:12px;font-weight:800;padding:4px 9px;border-radius:99px}
.body{padding:14px;display:flex;flex-direction:column;gap:8px;flex:1}
.price{font-family:Unbounded,Manrope,sans-serif;font-weight:600;font-size:18px}
.title{font-weight:800;line-height:1.3}
.stack{display:flex;flex-wrap:wrap;gap:6px}
.stack i{font-style:normal;font-size:12px;font-weight:600;background:var(--acc2);color:var(--acc);padding:3px 8px;border-radius:8px}
.meta{margin-top:auto;font-size:13px;color:var(--mute);display:flex;justify-content:space-between;gap:8px}
.ok{color:var(--ok);font-weight:800}
.empty{text-align:center;padding:48px 16px;color:var(--mute)}
.empty div{font-size:48px}
.overlay{position:fixed;inset:0;background:rgba(10,12,25,.6);z-index:50;display:none;align-items:flex-end;justify-content:center}
.overlay.on{display:flex}
.modal{background:var(--card);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:22px;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@media(min-width:700px){.overlay{align-items:center}.modal{border-radius:24px}}
.mh{display:flex;justify-content:space-between;align-items:start;gap:12px}
.mh h2{font-size:22px;line-height:1.25}
.x{width:40px;height:40px;border-radius:50%;background:var(--bg);font-size:18px;flex:none}
.big{height:150px;border-radius:14px;display:grid;place-items:center;font-size:72px;margin:16px 0}
.vibe{background:var(--bg);border-radius:14px;padding:14px;margin:14px 0}
.vibe h3{font-size:14px;margin-bottom:10px}
.meter{height:10px;border-radius:9px;background:var(--line);overflow:hidden}
.meter span{display:block;height:100%;background:linear-gradient(90deg,var(--acc),#ff6bd6)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;font-size:14px}
.kv b{display:block;font-size:16px}
.acts{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.acts .btn{flex:1;text-align:center}
form{display:grid;gap:12px;margin-top:14px}
form label{display:grid;gap:5px;font-weight:600;font-size:14px}
form input,form select,form textarea{padding:11px 12px;border-radius:12px;border:2px solid var(--line);background:var(--bg)}
form input:focus,form textarea:focus,form select:focus{border-color:var(--acc);outline:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.check{display:flex!important;grid-auto-flow:column;align-items:center;gap:10px!important}
.fab{position:fixed;right:16px;bottom:16px;z-index:30;box-shadow:0 10px 24px -6px rgba(91,77,255,.6);padding:15px 22px;border-radius:99px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:90vw}
.toast.on{opacity:1;transform:translateX(-50%)}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.gal{display:flex;gap:8px;overflow-x:auto;margin:16px 0;scroll-snap-type:x mandatory}
.gal img{height:220px;max-width:100%;border-radius:14px;scroll-snap-align:start;flex:none;object-fit:cover}
.phs{display:flex;gap:10px;flex-wrap:wrap}
.pv{position:relative;width:72px;height:72px}
.pv img{width:100%;height:100%;object-fit:cover;border-radius:10px}
.pv button{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--bg);font-size:12px}
.ava{position:relative}
.dot{position:absolute;top:0;right:0;width:13px;height:13px;border-radius:50%;background:var(--heart);border:2px solid var(--card)}
.bd{background:var(--heart);color:#fff;border-radius:99px;padding:1px 7px;font-size:12px;font-weight:800;margin-left:6px}
.row.chat{width:100%;text-align:left}
.back{color:var(--acc);font-weight:800;margin-bottom:6px}
.msgs{height:min(52vh,420px);overflow:auto;display:flex;flex-direction:column;gap:8px;padding:12px 0}
.msg{max-width:82%;align-self:flex-start;background:var(--bg);padding:8px 12px;border-radius:14px 14px 14px 4px;display:grid;gap:2px}
.msg.me{align-self:flex-end;background:var(--acc);color:#fff;border-radius:14px 14px 4px 14px}
.msg span{overflow-wrap:anywhere}.msg small{font-size:11px;opacity:.7}
form.send{display:flex;gap:8px;margin-top:8px}.send input{flex:1;min-width:0}
.rs{background:var(--acc2)!important;color:var(--acc);font-weight:800}
.is-sold .thumb{filter:grayscale(1);opacity:.55}
.soldb{font-family:Manrope,sans-serif;font-size:11px;font-weight:800;background:var(--ink);color:var(--bg);padding:2px 8px;border-radius:99px;vertical-align:middle}
.price s{color:var(--mute);font-weight:400}
.lnk{color:var(--acc);font-weight:800;text-decoration:underline;font-size:inherit}
.sub{display:flex;gap:16px;margin-top:12px}.sub button{color:var(--mute);font-weight:600;font-size:14px}
.sh{font-size:14px;margin:18px 0 8px}
.simr{display:grid;gap:8px}
.sim{display:flex;align-items:center;gap:10px;text-align:left;padding:8px;border-radius:12px;background:var(--bg);width:100%}
.sim span{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-size:20px;flex:none}
.sim b{flex:1;min-width:0;font-size:14px}.sim em{font-style:normal;font-weight:800}
.btn:disabled{opacity:.5;cursor:not-allowed}
:root{--acc:#0b7fd6;--acc2:#e3f2fd}
:root[data-theme=dark]{--acc:#4cb8ff;--acc2:#16314a}
:root[data-theme=dark] .btn:not(.ghost),:root[data-theme=dark] .ava,:root[data-theme=dark] .chip[aria-pressed=true],:root[data-theme=dark] .msg.me{color:#06121f}
.logo{cursor:pointer}
.thumb{height:auto;aspect-ratio:4/3}
.hero{padding:18px 0 0}.hero h1{font-size:clamp(20px,3vw,28px)}.hero p,.stats{display:none}
.overlay{position:static!important;background:none!important;display:none;padding:0}
.overlay.on{display:block}
.modal{max-width:1040px!important;max-height:none!important;margin:12px auto;width:calc(100% - 24px);border-radius:var(--r)!important;animation:none;box-shadow:var(--shadow)}
.it{font-size:clamp(20px,3vw,28px);line-height:1.2;margin:6px 0 16px}
.ip{display:grid;grid-template-columns:1fr 340px;gap:24px;align-items:start}
.ipr{display:grid;gap:10px;position:sticky;top:120px;background:var(--bg);padding:16px;border-radius:14px}
.ipr .btn{width:100%;text-align:center}
.seller{display:flex;gap:12px;align-items:center;padding-top:8px;border-top:1px solid var(--line)}
.gmain img{width:100%;max-height:460px;object-fit:contain;background:var(--bg);border-radius:14px}
.gth{display:flex;gap:8px;margin-top:8px;overflow-x:auto}
.gth img{width:76px;height:58px;object-fit:cover;border-radius:8px;cursor:pointer;flex:none}
.dsc{white-space:pre-wrap;overflow-wrap:anywhere}
.specs{display:grid;grid-template-columns:150px 1fr;gap:8px 12px}.specs dt{color:var(--mute)}
@media(max-width:800px){.ip{grid-template-columns:1fr}.ipr{position:static}}
.cp{display:grid;grid-template-columns:340px 1fr;height:calc(100vh - 170px);min-height:420px;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.cp aside{border-right:1px solid var(--line);overflow:auto}
.cp section{display:flex;flex-direction:column;min-width:0}
.cp .row.chat{padding:12px;border-bottom:1px solid var(--line);border-radius:0}
.cp .row.chat.on{background:var(--acc2)}
.cph{padding:12px 14px;border-bottom:1px solid var(--line);display:grid;gap:2px}
.cp .msgs{flex:1;height:auto;padding:12px 14px}
.cp form.send{padding:10px;border-top:1px solid var(--line);margin:0}
@media(max-width:700px){.cp{grid-template-columns:1fr}.cp.th aside{display:none}.cp:not(.th) section{display:none}#navChats .nm{display:none}}
.acct{position:relative;flex:none}
.ava{width:44px;height:44px;border-radius:50%;background:var(--acc);color:#fff;font-weight:800;font-size:18px}
.ava.big2{width:56px;height:56px;display:grid;place-items:center;flex:none}
.menu{position:absolute;right:0;top:calc(100% + 8px);background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);min-width:230px;padding:6px;z-index:40}
.menu[hidden]{display:none}
.menu button{display:block;width:100%;text-align:left;padding:11px 12px;border-radius:10px;font-weight:600}
.menu button:hover{background:var(--bg)}
.mn{padding:10px 12px;border-bottom:1px solid var(--line);margin-bottom:6px;display:grid;font-size:14px}
.mn span,.mute{color:var(--mute);font-size:13px}
.mn span{overflow:hidden;text-overflow:ellipsis}
.err{color:var(--heart);font-weight:600;min-height:1em;font-size:14px}
.sw{margin-top:14px;text-align:center;color:var(--mute)}.sw button{color:var(--acc);font-weight:800}
.prof{display:flex;gap:14px;align-items:center;margin-top:14px}
.row{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.row .em{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;font-size:24px;flex:none}
.row>div:not(.em){flex:1;min-width:0}
.del{width:40px;height:40px;border-radius:10px;background:var(--bg)}
@media(max-width:560px){.simr{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.sim{min-height:132px;padding:8px}.sim .simicon{height:54px}.top{flex-wrap:wrap}.search{order:5;flex-basis:100%}.logo{margin-right:auto}}
footer{text-align:center;color:var(--mute);font-size:13px;padding:24px 16px}
@media(max-width:560px){
 .logo span{display:none}.btn.add{display:none}
 .grid{grid-template-columns:repeat(2,1fr);gap:10px}
 .thumb{height:96px;font-size:44px}.body{padding:10px}.price{font-size:15px}.title{font-size:14px}
 .bar .count{width:100%;margin:0}.two{grid-template-columns:1fr}
}
@media(min-width:561px){.fab{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<body>
<header>
 <div class="wrap">
  <div class="top">
   <div class="logo">Вайб<b>Маркет</b></div>
   <div class="search"><span>🔍</span><input id="q" type="search" placeholder="Что ищем? Например: бот, лендинг, React" aria-label="Поиск"></div>
   <button class="icon" id="theme" aria-label="Сменить тему">🌙</button>
   <button class="btn ghost" id="navChats">💬 <span class="nm">Сообщения</span><span class="bd" id="ub2" hidden></span></button>
   <button class="btn add" id="addTop">+ Подать объявление</button>
   <div class="acct" id="acct"></div>
  </div>
  <div class="cats" id="cats" role="group" aria-label="Категории"></div>
 </div>
</header>

<main class="wrap">
 <section class="hero" style="padding:8px 0 0">
  <div class="stats" id="stats" hidden></div>
 </section>

 <div class="bar">
  <select id="sort" aria-label="Сортировка">
   <option value="new">Сначала новые</option>
   <option value="cheap">Сначала дешёвые</option>
   <option value="exp">Сначала дорогие</option>
   <option value="roi">Быстрее окупятся</option>
  </select>
  <select id="price" aria-label="Цена">
   <option value="0">Любая цена</option>
   <option value="100">до $100</option>
   <option value="500">до $500</option>
   <option value="2000">до $2 000</option>
  </select>
  <label><input type="checkbox" id="rev"> Приносят доход</label>
  <label><input type="checkbox" id="favOnly"> ♥ Избранное</label>
  <button class="chip rs" id="reset" hidden>✕ Сбросить фильтры</button>
  <span class="count" id="count"></span>
 </div>

 <div class="grid" id="grid"></div>
 <div class="empty" id="empty" hidden><div>🫥</div><p>Ничего не найдено. Сбросьте фильтры или подайте своё объявление.</p></div>
</main>

<footer>ВайбМаркет · аккаунты и объявления хранятся в файле db.json рядом с server.js</footer>
<button class="btn fab" id="addFab">+ Продать</button>

<div class="overlay" id="ov"><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast"></div>

<script>

function shrink(file){return new Promise((ok,no)=>{const img=new Image(),u=URL.createObjectURL(file);
 img.onload=()=>{const k=Math.min(1,900/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL('image/jpeg',.8))};
 img.onerror=no;img.src=u})}

function renderCats(){

function list(){
 const q=$('#q').value.trim().toLowerCase(), mp=+$('#price').value, sort=$('#sort').value;
 let r=all().filter(i=>(cat==='all'||i.c===cat)
  &&(!q||(i.t+' '+i.d+' '+i.s.join(' ')).toLowerCase().includes(q))
  &&(!mp||i.p<=mp)&&(!$('#rev').checked||i.m>0)&&(!$('#favOnly').checked||favs.has(i.id)));
 const f={new:(a,b)=>b.n-a.n,cheap:(a,b)=>a.p-b.p,exp:(a,b)=>b.p-a.p,roi:(a,b)=>(roi(a)||1e9)-(roi(b)||1e9)};
 return r.sort((a,b)=>(a.sold?1:0)-(b.sold?1:0)||f[sort](a,b));
}

 </article>`).join('');

function getRecommendations(item){
 const related={site:['app','ext','tpl'],app:['site','saas','bot'],saas:['bot','app','site'],bot:['saas','app','ext'],tpl:['site','ext','app'],game:['app','site','tpl'],ext:['site','app','bot'],domain:['site','saas']};
 const baseTech=new Set((item.s||[]).map(v=>String(v).toLowerCase()));
 return all().filter(x=>x.id!==item.id&&!x.sold).map(x=>{
  const tech=(x.s||[]).filter(v=>baseTech.has(String(v).toLowerCase())).length;
  const sameCategory=x.c===item.c;
  const relatedCategory=(related[item.c]||[]).includes(x.c);
  const ratio=Math.max(1,Math.max(x.p,item.p))/Math.max(1,Math.min(x.p,item.p));
  const priceScore=Math.max(0,18-Math.log2(ratio)*5);
  const incomeScore=(x.m>0)===(item.m>0)?7:0;
  const aiScore=Math.max(0,8-Math.abs((x.ai||0)-(item.ai||0))/12.5);
  const score=(sameCategory?55:relatedCategory?24:0)+tech*14+priceScore+incomeScore+aiScore;
  return {item:x,score,tech};
 }).sort((a,b)=>b.score-a.score||b.item.n-a.item.n).slice(0,4).map(v=>v.item);
}

  ${sim.length?`<h3 class="sh">Вам также может понравиться</h3><div class="simr">${sim.map(x=>`<button class="sim" data-s="${x.id}"><span class="simicon" style="background:${hue(x)}">${emojiFor(x)}</span><b>${esc(x.t)}</b><small>${CATS.find(c=>c.id===x.c)?.n||'Проект'} · ${(x.s||[]).slice(0,2).map(esc).join(' / ')}</small><em>${money(x.p)}</em></button>`).join('')}</div>`:''}
 </div>
 <aside class="ipr">
  <div class="price" style="font-size:30px">${i.sold?'Продано':money(i.p)}</div>
  <button class="btn" data-a="buy"${i.sold?' disabled':''}>Купить с безопасной сделкой</button>
  <button class="btn ghost" data-a="msg">Написать продавцу</button>
  <div class="seller"><div class="ava big2">${esc(i.u[0].toUpperCase())}</div><div>${i.uid?`<button class="lnk" data-a="seller">${esc(i.u)}</button>`:`<b>${esc(i.u)}</b>`}<br><span class="mute">Продавец</span></div></div>
  <div class="sub"><button data-a="fav">${favs.has(i.id)?'♥ В избранном':'♡ В избранное'}</button><button data-a="share">🔗 Ссылка</button><button data-a="report">🚩 Жалоба</button></div>
 </aside></div>`);
 $('#modal').onclick=async e=>{
  const g=e.target.closest('[data-g]');if(g){$('#gm').src=ph[+g.dataset.g];return}
  const sm=e.target.closest('[data-s]');if(sm){openItem(+sm.dataset.s);return}
  const a=e.target.closest('[data-a]');if(!a)return;const act=a.dataset.a;
  if(act==='home'){closeModal();return}
  if(act==='buy'){openCheckout(i.id);return}
  if(act==='share'){copyLink(i.id);return}
  if(act==='seller'){openSeller(i.uid);return}
  if(!me){toast('Нужно войти в аккаунт');openAuth('login');return}
  try{

function openForm(it){at(it?'/edit/'+it.id:'/new');
 const E=!!it;

   <label>Доход в месяц, $ (если есть)<input name="m" type="number" min="0" value="${E?it.m:''}" placeholder="0"></label>

 </form>`);
 let photos=E?[...(it.ph||[])]:[];

 };
